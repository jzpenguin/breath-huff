<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Huff — blow-powered mini-games</title>
<style>
  :root{
    --night:#1B1436;
    --deep:#120E26;
    --ember:#FFB347;
    --flame:#FF6B4A;
    --mint:#7FE3C4;
    --paper:#F6EFE2;
    --dim:rgba(246,239,226,.55);
    --line:rgba(246,239,226,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #2A1F4E 0%, var(--night) 45%, var(--deep) 100%);
    color:var(--paper);
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-weight:600;
    overflow:hidden;
    touch-action:manipulation;
  }
  #app{
    height:100dvh;height:100vh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    max-width:520px;margin:0 auto;
    padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
  }

  /* ---------- HUD ---------- */
  #hud{display:flex;align-items:center;gap:10px;min-height:34px}
  #levelTag{
    font-size:13px;letter-spacing:.02em;color:var(--dim);
  }
  #levelTag b{color:var(--paper);font-size:15px}
  #modeChip{
    margin-left:auto;font-size:11.5px;font-weight:700;
    padding:4px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--dim);
  }
  #modeChip.touch{color:var(--ember);border-color:rgba(255,179,71,.45)}
  .iconbtn{
    background:none;border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12px;font-weight:700;
    padding:5px 10px;border-radius:999px;cursor:pointer;
  }
  .iconbtn:active{background:rgba(246,239,226,.08)}

  #ticks{display:flex;gap:4px;margin-top:10px}
  .tick{height:3px;flex:1;border-radius:2px;background:rgba(246,239,226,.14)}
  .tick.done{background:var(--mint)}
  .tick.now{background:var(--ember)}

  /* ---------- Stage ---------- */
  #stage{position:relative;display:grid;place-items:center}
  .scene{display:none;width:100%;text-align:center}
  .scene.live{display:block}
  #taskLine{
    font-size:14px;font-weight:600;color:var(--dim);
    margin:0 0 18px;min-height:19px;
  }
  #taskLine em{font-style:normal;color:var(--ember)}

  /* candles */
  #candles{display:flex;justify-content:center;align-items:flex-end;gap:9px;flex-wrap:wrap;min-height:150px}
  .candle{width:20px;display:flex;flex-direction:column;align-items:center}
  .flame{
    width:15px;height:26px;margin-bottom:3px;
    border-radius:50% 50% 46% 46% / 66% 66% 34% 34%;
    background:radial-gradient(ellipse at 50% 72%,#FFF3C4 0%,var(--ember) 42%,var(--flame) 78%,rgba(255,107,74,0) 100%);
    filter:drop-shadow(0 0 12px rgba(255,150,60,.75));
    animation:flicker .42s infinite alternate ease-in-out;
    transform-origin:50% 100%;
  }
  @keyframes flicker{from{transform:scale(1) skewX(-3deg)}to{transform:scale(1.1,.94) skewX(4deg)}}
  .candle.out .flame{opacity:0;transform:scale(.2) translateY(-14px);animation:none;transition:all .28s ease-out}
  .candle.out .wick{background:#6B5A7A}
  .wick{width:2px;height:6px;background:#3B2B14;border-radius:1px}
  .wax{width:20px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#FFF6E6,#D9C6A8)}
  .smoke{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:rgba(246,239,226,.4);pointer-events:none;
    animation:puff .9s ease-out forwards;
  }
  @keyframes puff{to{transform:translateY(-46px) scale(2.6);opacity:0}}

  /* generic gauge */
  .gauge{
    position:relative;height:16px;border-radius:999px;
    background:rgba(246,239,226,.12);overflow:hidden;margin:0 auto;max-width:300px;
  }
  .gauge .band{position:absolute;top:0;bottom:0;background:rgba(127,227,196,.32)}
  .gauge .fill{position:absolute;top:0;bottom:0;left:0;background:var(--ember);border-radius:999px}
  .gauge .needle{position:absolute;top:-4px;width:3px;height:24px;border-radius:2px;background:var(--paper)}
  .caption{font-size:12.5px;color:var(--dim);margin-top:9px}

  /* long blow */
  #holdRing{display:block;margin:0 auto}
  #holdNum{font-size:44px;font-weight:800;letter-spacing:-.02em}
  #holdSub{font-size:12.5px;color:var(--dim);margin-top:2px}

  /* balloon */
  #balloonWrap{height:210px;display:grid;place-items:center}
  #balloon{transition:none;transform-origin:50% 88%}
  #balloon.pop{animation:pop .28s ease-out forwards}
  @keyframes pop{to{transform:scale(1.5);opacity:0}}

  /* pinwheel */
  #pinWrap{height:200px;display:grid;place-items:center}

  /* ---------- Breath meter ---------- */
  #meter{padding-top:8px}
  #breathBar{
    height:12px;border-radius:999px;background:rgba(246,239,226,.12);overflow:hidden;
  }
  #breathFill{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--mint),var(--ember) 62%,var(--flame));
    transition:width .06s linear;
  }
  #status{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:var(--dim)}
  #padHint{margin-left:auto}
  #pad{
    display:none;margin-top:12px;width:100%;padding:20px;border-radius:20px;
    background:rgba(255,179,71,.14);border:1px solid rgba(255,179,71,.4);
    color:var(--ember);font:inherit;font-size:16px;font-weight:700;cursor:pointer;
  }
  #pad.on{display:block}
  #pad:active{background:rgba(255,179,71,.3)}

  /* ---------- Overlay ---------- */
  #overlay{
    position:fixed;inset:0;display:grid;place-items:center;padding:24px;
    background:rgba(18,14,38,.9);backdrop-filter:blur(8px);z-index:20;
  }
  #overlay.hide{display:none}
  .card{max-width:340px;text-align:center}
  .card h1{
    font-size:46px;line-height:.94;margin:0 0 6px;font-weight:800;letter-spacing:-.03em;
  }
  .card h2{font-size:24px;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
  .card p{font-size:14.5px;line-height:1.55;color:var(--dim);font-weight:500;margin:0 0 18px}
  .card p.warn{color:var(--ember)}
  .btn{
    width:100%;padding:15px;border:none;border-radius:16px;
    background:var(--ember);color:#2A1706;font:inherit;font-size:16px;font-weight:800;
    cursor:pointer;margin-top:8px;
  }
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:600}
  .btn:active{transform:translateY(1px)}
  .rule{height:1px;background:var(--line);margin:20px 0}
  .tinylist{text-align:left;font-size:13px;font-weight:500;color:var(--dim);line-height:1.7;margin:0;padding-left:18px}
  @media (prefers-reduced-motion:reduce){
    .flame{animation:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="levelTag">Level <b id="lvlNum">1</b> · <span id="lvlName">Candles</span></div>
    <button class="iconbtn" id="retryBtn" type="button">Retry</button>
    <div id="modeChip">Mic</div>
  </div>
  <div id="ticks"></div>

  <div id="stage">
    <div class="scene" id="sc-candles">
      <p id="taskLine-candles" class="task"></p>
      <div id="candles"></div>
    </div>

    <div class="scene" id="sc-hold">
      <p class="task" id="taskLine-hold"></p>
      <svg id="holdRing" width="180" height="180" viewBox="0 0 180 180" aria-hidden="true">
        <circle cx="90" cy="90" r="76" fill="none" stroke="rgba(246,239,226,.14)" stroke-width="12"/>
        <circle id="holdArc" cx="90" cy="90" r="76" fill="none" stroke="#7FE3C4" stroke-width="12"
                stroke-linecap="round" stroke-dasharray="477" stroke-dashoffset="477"
                transform="rotate(-90 90 90)"/>
      </svg>
      <div id="holdNum">0.0s</div>
      <div id="holdSub">keep it steady</div>
    </div>

    <div class="scene" id="sc-balloon">
      <p class="task" id="taskLine-balloon"></p>
      <div id="balloonWrap">
        <svg id="balloon" width="150" height="180" viewBox="0 0 150 180" aria-hidden="true">
          <ellipse cx="75" cy="76" rx="52" ry="62" fill="url(#bg1)"/>
          <path d="M75 138 l-9 12 h18 z" fill="#E0577A"/>
          <path d="M75 150 q10 14 -2 26" stroke="rgba(246,239,226,.5)" stroke-width="2" fill="none"/>
          <ellipse cx="57" cy="52" rx="13" ry="18" fill="rgba(255,255,255,.28)"/>
          <defs><radialGradient id="bg1" cx="35%" cy="30%">
            <stop offset="0%" stop-color="#FF9AB2"/><stop offset="100%" stop-color="#D63E68"/>
          </radialGradient></defs>
        </svg>
      </div>
      <div class="gauge" id="balloonGauge">
        <div class="band"></div><div class="needle"></div>
      </div>
      <div class="caption" id="balloonCap">get the balloon into the green — then stop</div>
    </div>

    <div class="scene" id="sc-pin">
      <p class="task" id="taskLine-pin"></p>
      <div id="pinWrap">
        <svg id="pinwheel" width="170" height="170" viewBox="0 0 170 170" aria-hidden="true">
          <g id="pinSpin" transform-origin="85 85">
            <path d="M85 85 L85 18 Q118 22 112 58 Z" fill="#7FE3C4"/>
            <path d="M85 85 L152 85 Q148 118 112 112 Z" fill="#FFB347"/>
            <path d="M85 85 L85 152 Q52 148 58 112 Z" fill="#FF6B4A"/>
            <path d="M85 85 L18 85 Q22 52 58 58 Z" fill="#B58CFF"/>
          </g>
          <circle cx="85" cy="85" r="8" fill="#F6EFE2"/>
        </svg>
      </div>
      <div class="gauge" id="pinGauge">
        <div class="band"></div><div class="needle"></div>
      </div>
      <div class="caption" id="pinCap">hold the needle in the green</div>
    </div>
  </div>

  <div id="meter">
    <div id="breathBar"><div id="breathFill"></div></div>
    <div id="status">
      <span id="statusText">Breath</span>
      <span id="padHint"></span>
    </div>
    <button id="pad" type="button">Hold to blow</button>
  </div>
</div>

<div id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
(() => {
"use strict";

/* ============ Levels ============ */
const LEVELS = [
  {g:"candles", name:"Candles",  count:3, rate:1.5, limit:14},
  {g:"hold",    name:"Long blow",need:2.5, min:.22, limit:16},
  {g:"balloon", name:"Balloon",  lo:.42, hi:.60, max:.80, hold:1.0, limit:22},
  {g:"pin",     name:"Pinwheel", lo:.32, hi:.60, need:2.5, limit:22},

  {g:"candles", name:"Candles",  count:5, rate:1.3, limit:14},
  {g:"hold",    name:"Long blow",need:4.0, min:.30, limit:18},
  {g:"balloon", name:"Balloon",  lo:.52, hi:.68, max:.86, hold:1.2, limit:22},
  {g:"pin",     name:"Pinwheel", lo:.46, hi:.70, need:3.5, limit:24},

  {g:"candles", name:"Candles",  count:7, rate:1.15,limit:14},
  {g:"hold",    name:"Long blow",need:6.0, min:.35, limit:20},
  {g:"balloon", name:"Balloon",  lo:.64, hi:.77, max:.92, hold:1.5, limit:24},
  {g:"pin",     name:"Pinwheel", lo:.58, hi:.78, need:4.5, limit:26}
];

/* ============ Elements ============ */
const $ = id => document.getElementById(id);
const overlay=$("overlay"), card=$("card"), pad=$("pad");
const fill=$("breathFill"), statusText=$("statusText"), padHint=$("padHint");
const modeChip=$("modeChip"), lvlNum=$("lvlNum"), lvlName=$("lvlName"), ticks=$("ticks");

/* ============ Breath input ============ */
const breath = {
  mode:"none",       // "mic" | "touch"
  raw:0, power:0,
  floor:0, peak:1,
  held:false,
  touchVal:0,
  analyser:null, buf:null, stream:null, ctx:null,

  async startMic(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error("This browser won't hand over the microphone here.");
    this.stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false
    }});
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    if(this.ctx.state === "suspended") await this.ctx.resume();
    const src = this.ctx.createMediaStreamSource(this.stream);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 1024;
    this.analyser.smoothingTimeConstant = 0.55;
    src.connect(this.analyser);
    this.buf = new Uint8Array(this.analyser.frequencyBinCount);
    this.mode = "mic";
  },

  useTouch(){ this.mode="touch"; },

  // low-frequency broadband energy = breath noise across the mic
  sample(){
    if(this.mode === "touch"){
      const target = this.held ? 1 : 0;
      const k = this.held ? 0.14 : 0.10;
      this.touchVal += (target - this.touchVal) * k;
      this.raw = this.touchVal;
      this.power = this.raw;
      return;
    }
    if(!this.analyser){ this.power = 0; return; }
    this.analyser.getByteFrequencyData(this.buf);
    let low = 0;
    for(let i=1;i<=16;i++) low += this.buf[i];      // ~40–700 Hz
    low /= 16;
    this.raw = low;
    if(low > this.peak) this.peak = low;
    this.peak = Math.max(this.floor + 18, this.peak * 0.9992);
    const p = (low - this.floor) / Math.max(8, this.peak - this.floor);
    const clamped = Math.max(0, Math.min(1, p));
    this.power += (clamped - this.power) * 0.30;    // smoothing
    if(this.power < 0.04) this.power = 0;
  },

  calibrate(ms=1600){
    return new Promise(res => {
      let n=0, sum=0;
      const t = setInterval(()=>{
        this.analyser.getByteFrequencyData(this.buf);
        let low=0; for(let i=1;i<=16;i++) low+=this.buf[i];
        sum += low/16; n++;
      },40);
      setTimeout(()=>{ clearInterval(t);
        this.floor = (n? sum/n : 0) + 6;
        this.peak  = this.floor + 34;
        res(this.floor);
      }, ms);
    });
  }
};

pad.addEventListener("pointerdown", e=>{ e.preventDefault(); breath.held=true; });
["pointerup","pointercancel","pointerleave"].forEach(ev =>
  pad.addEventListener(ev, ()=>{ breath.held=false; }));

/* ============ Game state ============ */
let level = 0, running = false, last = 0, s = {};
const scenes = {candles:$("sc-candles"), hold:$("sc-hold"), balloon:$("sc-balloon"), pin:$("sc-pin")};

function showScene(k){
  for(const key in scenes) scenes[key].classList.toggle("live", key===k);
}
function drawTicks(){
  ticks.innerHTML = "";
  LEVELS.forEach((_,i)=>{
    const d = document.createElement("div");
    d.className = "tick" + (i<level ? " done" : i===level ? " now" : "");
    ticks.appendChild(d);
  });
}
function setBand(el, lo, hi){
  const b = el.querySelector(".band");
  b.style.left = (lo*100)+"%";
  b.style.width = ((hi-lo)*100)+"%";
}
function setNeedle(el, v){
  el.querySelector(".needle").style.left = "calc("+(Math.max(0,Math.min(1,v))*100)+"% - 1.5px)";
}

/* ---- level setup ---- */
function startLevel(){
  const L = LEVELS[level];
  s = {cfg:L, t:0, done:false, failed:false};
  lvlNum.textContent = level+1;
  lvlName.textContent = L.name;
  drawTicks();
  showScene(L.g);

  if(L.g === "candles"){
    s.progress = 0;
    const box = $("candles"); box.innerHTML = "";
    for(let i=0;i<L.count;i++){
      const c = document.createElement("div"); c.className="candle";
      const h = 54 + (i%3)*14;
      c.innerHTML = '<div class="flame"></div><div class="wick"></div>'+
                    '<div class="wax" style="height:'+h+'px"></div>';
      box.appendChild(c);
    }
    s.candles = [...box.children];
    task("candles", "Blow out all "+L.count+" candles before the wax runs down");
  }

  if(L.g === "hold"){
    s.held = 0;
    task("hold", "Hold one steady breath for <em>"+L.need.toFixed(1)+"s</em>");
  }

  if(L.g === "balloon"){
    s.size = 0; s.inZone = 0; s.popped = false;
    $("balloon").classList.remove("pop");
    setBand($("balloonGauge"), L.lo, L.hi);
    task("balloon", "Inflate into the green and hold — pop it and you start over");
  }

  if(L.g === "pin"){
    s.speed = 0; s.angle = 0; s.inZone = 0;
    setBand($("pinGauge"), L.lo, L.hi);
    task("pin", "Spin the pinwheel and keep it in the green for <em>"+L.need.toFixed(1)+"s</em>");
  }

  running = true; last = performance.now();
}
function task(k, html){ $("taskLine-"+k).innerHTML = html; }

/* ---- per-frame updates ---- */
function update(dt, p){
  const L = s.cfg;
  s.t += dt;

  if(L.g === "candles"){
    if(p > 0.16) s.progress += p * L.rate * dt;
    const out = Math.min(L.count, Math.floor(s.progress));
    s.candles.forEach((c,i)=>{
      const isOut = i < out;
      if(isOut && !c.classList.contains("out")){
        c.classList.add("out"); puff(c);
      }
    });
    if(out >= L.count) win();
    else if(s.t > L.limit) fail("Time's up — a few were still burning.");
  }

  if(L.g === "hold"){
    if(p >= L.min) s.held += dt;
    else s.held = Math.max(0, s.held - dt*2.2);
    const frac = Math.min(1, s.held / L.need);
    $("holdArc").style.strokeDashoffset = String(477 * (1-frac));
    $("holdNum").textContent = s.held.toFixed(1)+"s";
    $("holdSub").textContent = p >= L.min ? "keep going" : "not hard enough";
    if(s.held >= L.need) win();
    else if(s.t > L.limit) fail("Ran out of time before the breath ran long enough.");
  }

  if(L.g === "balloon"){
    s.size += p * 0.55 * dt;
    s.size -= 0.13 * dt;                       // slow deflate
    s.size = Math.max(0, s.size);
    const b = $("balloon");
    b.style.transform = "scale("+(0.4 + s.size*0.85)+")";
    setNeedle($("balloonGauge"), s.size);
    if(s.size > L.max && !s.popped){
      s.popped = true; b.classList.add("pop");
      return fail("Pop. Ease off sooner next time.");
    }
    if(s.size >= L.lo && s.size <= L.hi){
      s.inZone += dt;
      $("balloonCap").textContent = "holding… "+s.inZone.toFixed(1)+"s";
    }else{
      s.inZone = 0;
      $("balloonCap").textContent = s.size < L.lo ? "more air" : "too big — let it settle";
    }
    if(s.inZone >= L.hold) win();
    else if(s.t > L.limit) fail("Time's up — never settled in the green.");
  }

  if(L.g === "pin"){
    s.speed += p * 1.6 * dt;
    s.speed -= s.speed * 0.9 * dt;             // friction
    s.speed = Math.max(0, Math.min(1.2, s.speed));
    s.angle += s.speed * 900 * dt;
    $("pinSpin").setAttribute("transform","rotate("+s.angle+" 85 85)");
    setNeedle($("pinGauge"), s.speed);
    if(s.speed >= L.lo && s.speed <= L.hi){
      s.inZone += dt;
      $("pinCap").textContent = "in the green… "+s.inZone.toFixed(1)+"s";
    }else{
      $("pinCap").textContent = s.speed < L.lo ? "faster" : "too fast";
    }
    if(s.inZone >= L.need) win();
    else if(s.t > L.limit) fail("Time's up — the wheel never settled.");
  }
}

function puff(candle){
  const r = candle.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "smoke";
  d.style.left = (r.left + r.width/2 - 3)+"px";
  d.style.top  = (r.top + 4)+"px";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 950);
}

/* ---- loop ---- */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  breath.sample();
  fill.style.width = (breath.power*100).toFixed(1)+"%";
  if(running) update(dt, breath.power);
}

/* ---- outcomes ---- */
function win(){
  running = false;
  level++;
  if(level >= LEVELS.length) return finished();
  show(`<h2>Level ${level} down</h2>
        <p>Next up: ${LEVELS[level].name}.</p>
        <button class="btn" id="next">Start level ${level+1}</button>`,
       {next: ()=>{ hide(); startLevel(); }});
}
function fail(msg){
  running = false;
  show(`<h2>Not this time</h2><p>${msg}</p>
        <button class="btn" id="again">Try level ${level+1} again</button>`,
       {again: ()=>{ hide(); startLevel(); }});
}
function finished(){
  show(`<h1>All twelve</h1>
        <p>Twelve levels, four games, one set of lungs. Go again?</p>
        <button class="btn" id="restart">Start from level 1</button>`,
       {restart: ()=>{ level=0; hide(); startLevel(); }});
}

/* ---- overlay ---- */
function show(html, handlers){
  card.innerHTML = html;
  overlay.classList.remove("hide");
  for(const id in handlers){
    const el = $(id);
    if(el) el.addEventListener("click", handlers[id]);
  }
}
function hide(){ overlay.classList.add("hide"); }

/* ---- input mode plumbing ---- */
function applyMode(){
  if(breath.mode === "touch"){
    modeChip.textContent = "Touch";
    modeChip.classList.add("touch");
    pad.classList.add("on");
    statusText.textContent = "Press strength";
    padHint.textContent = "mic unavailable";
  }else{
    modeChip.textContent = "Mic";
    modeChip.classList.remove("touch");
    pad.classList.remove("on");
    statusText.textContent = "Breath";
    padHint.textContent = "blow across the bottom of the phone";
  }
}

/* ---- start flow ---- */
function titleCard(){
  show(`<h1>Huff</h1>
        <p>Four breath games, twelve levels. Blow across the speaker slot at the
        bottom of your phone — not straight into it, or you'll just get thumps.</p>
        <ul class="tinylist">
          <li>Candles — put them all out</li>
          <li>Long blow — one steady breath</li>
          <li>Balloon — big, but not too big</li>
          <li>Pinwheel — hold a speed</li>
        </ul>
        <div class="rule"></div>
        <button class="btn" id="go">Turn on the mic</button>
        <button class="btn ghost" id="skip">Play without the mic</button>`,
    {
      go: async () => {
        card.innerHTML = `<h2>Listening</h2><p>Stay quiet for a second while it
          works out how loud your room is.</p>`;
        try{
          await breath.startMic();
          await breath.calibrate();
          applyMode();
          testCard();
        }catch(err){
          micFailed(err);
        }
      },
      skip: () => { breath.useTouch(); applyMode(); hide(); startLevel(); }
    });
}

function micFailed(err){
  const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
  show(`<h2>No microphone</h2>
        <p class="warn">${denied
          ? "The mic was blocked. In an embedded page the browser often refuses outright — download the file and open it directly in Safari or Chrome to blow for real."
          : (err && err.message ? err.message : "Couldn't reach the microphone.")}</p>
        <p>You can still play every level with the hold button instead.</p>
        <button class="btn" id="touch">Play with the hold button</button>
        <button class="btn ghost" id="retryMic">Ask for the mic again</button>`,
    {
      touch: () => { breath.useTouch(); applyMode(); hide(); startLevel(); },
      retryMic: () => titleCard()
    });
}

function testCard(){
  show(`<h2>Give it a test blow</h2>
        <p>The bar at the bottom should jump. If it barely moves, blow across the
        speaker slot rather than at it.</p>
        <div id="testBar" style="height:12px;border-radius:999px;background:rgba(246,239,226,.14);overflow:hidden">
          <div id="testFill" style="height:100%;width:0;background:#FFB347"></div>
        </div>
        <button class="btn" id="begin" style="margin-top:20px">Start level 1</button>
        <button class="btn ghost" id="recal">Measure the room again</button>`,
    {
      begin: ()=>{ hide(); startLevel(); },
      recal: async ()=>{
        card.querySelector("h2").textContent = "Listening";
        await breath.calibrate();
        testCard();
      }
    });
  const tf = $("testFill");
  const t = setInterval(()=>{
    if(!tf.isConnected) return clearInterval(t);
    tf.style.width = (breath.power*100).toFixed(0)+"%";
  }, 60);
}

$("retryBtn").addEventListener("click", ()=>{ if(running){ running=false; startLevel(); } });

applyMode();
drawTicks();
titleCard();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
