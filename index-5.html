<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bubble Sky</title>
<style>
  :root{
    --deep:#08243B; --sea:#0E3B5C; --sky:#7FD4F0; --sun:#FFD166;
    --coral:#FF8C6B; --mint:#8FE6C3; --plum:#B79CFF;
    --paper:#F2F7F9; --dim:rgba(242,247,249,.6); --line:rgba(242,247,249,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:linear-gradient(180deg,#061B2E 0%,var(--deep) 40%,var(--sea) 100%);
    color:var(--paper);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
    font-weight:600;overflow:hidden;touch-action:manipulation;
  }
  #app{height:100dvh;height:100vh;max-width:520px;margin:0 auto;display:grid;
       grid-template-rows:auto 1fr auto;
       padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}

  #top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);min-height:32px}
  #top b{color:var(--paper)}
  .ghostbtn{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;
            font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;cursor:pointer}
  .ghostbtn.right{margin-left:auto}

  #play{position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
  #hint{font-size:15px;color:var(--dim);margin-bottom:14px;min-height:20px}
  #bignum{font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1}
  #sub{font-size:13px;color:var(--dim);margin-top:6px;font-weight:600;min-height:18px}

  #bottom{padding-top:10px}
  #lvlBar{height:10px;border-radius:999px;background:rgba(242,247,249,.12);overflow:hidden}
  #lvlFill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .07s linear}
  #meta{display:flex;font-size:12px;color:var(--dim);margin-top:8px}
  #meta span:last-child{margin-left:auto}

  /* shared bits */
  .row{display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .candle{width:20px;display:flex;flex-direction:column;align-items:center}
  .flame{width:15px;height:26px;margin-bottom:3px;border-radius:50% 50% 46% 46%/66% 66% 34% 34%;
    background:radial-gradient(ellipse at 50% 72%,#FFF3C4 0%,var(--sun) 42%,var(--coral) 78%,rgba(255,140,107,0) 100%);
    filter:drop-shadow(0 0 12px rgba(255,180,90,.7));animation:flick .45s infinite alternate;transform-origin:50% 100%}
  @keyframes flick{from{transform:scale(1) skewX(-3deg)}to{transform:scale(1.1,.94) skewX(4deg)}}
  .candle.out .flame{opacity:0;transform:scale(.2) translateY(-12px);animation:none;transition:.28s}
  .wick{width:2px;height:6px;background:#3B2B14}
  .wax{width:20px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#FFF6E6,#D9C6A8)}

  .track{position:relative;height:110px;margin:0 auto;max-width:330px;
         border-bottom:2px dashed rgba(242,247,249,.22)}
  .mover{position:absolute;bottom:6px;left:0;transition:left .12s linear}
  .goal{position:absolute;right:0;bottom:4px;width:34px;height:52px;
        border:3px solid rgba(242,247,249,.4);border-right:none;border-radius:6px 0 0 6px}

  .tissue{width:74px;height:92px;background:linear-gradient(180deg,#fff,#D7E6EC);
          border-radius:5px 5px 12px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35);
          transition:transform .09s linear;transform-origin:50% 100%}

  #paintCanvas{border-radius:16px;background:#F7F3EA;max-width:100%}

  .repdots{display:flex;gap:7px;justify-content:center;margin-top:18px}
  .dot{width:11px;height:11px;border-radius:50%;background:rgba(242,247,249,.2)}
  .dot.on{background:var(--mint)}

  /* overlay + menus */
  #ov{position:fixed;inset:0;padding:22px;background:rgba(6,27,46,.95);
      backdrop-filter:blur(8px);z-index:20;overflow-y:auto;display:grid;place-items:start center}
  #ov.hide{display:none}
  .card{max-width:360px;width:100%;text-align:center;padding:12px 0 40px}
  .card h1{font-size:40px;line-height:.95;margin:0 0 10px;font-weight:800;letter-spacing:-.03em}
  .card h2{font-size:22px;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
  .card p{font-size:14.5px;line-height:1.55;color:var(--dim);font-weight:500;margin:0 0 16px}
  .btn{width:100%;padding:15px;border:none;border-radius:15px;background:var(--sun);
       color:#33240A;font:inherit;font-size:16px;font-weight:800;cursor:pointer;margin-top:9px}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:600}
  .btn:active{transform:translateY(1px)}
  .note{font-size:12px;color:rgba(242,247,249,.42);font-weight:500;line-height:1.5;margin-top:20px}
  .rule{height:1px;background:var(--line);margin:18px 0}

  .grouphead{text-align:left;font-size:13px;color:var(--dim);margin:22px 0 8px;font-weight:700}
  .gamebtn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;
    padding:13px 14px;margin-bottom:8px;border-radius:14px;cursor:pointer;
    background:rgba(242,247,249,.07);border:1px solid var(--line);color:var(--paper);font:inherit}
  .gamebtn .nm{font-size:15px;font-weight:700}
  .gamebtn .ds{font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}
  .gamebtn .pip{width:9px;height:9px;border-radius:50%;flex:none}
  .pip.short{background:var(--coral)} .pip.long{background:var(--mint)} .pip.huff{background:var(--plum)}

  .field{display:flex;align-items:center;gap:12px;margin-bottom:12px;text-align:left}
  .field label{flex:1;font-size:14px}
  .field small{display:block;font-size:11.5px;color:var(--dim);font-weight:500;margin-top:2px}
  .field input{width:76px;padding:10px;border-radius:11px;text-align:center;
    background:rgba(242,247,249,.08);border:1px solid var(--line);color:var(--paper);
    font:inherit;font-size:16px;font-weight:700}

  table.rec{width:100%;border-collapse:collapse;font-size:12px;font-weight:600}
  table.rec th{color:var(--dim);font-weight:600;font-size:11px;padding:4px 0}
  table.rec td:first-child,table.rec th:first-child{text-align:left;width:38%}
  table.rec td{padding:3px 0;text-align:center}
  .cell{width:100%;padding:7px 0;border-radius:7px;background:rgba(242,247,249,.07);
        border:1px solid var(--line);color:var(--paper);font:inherit;font-size:12px;cursor:pointer}
  .cell.tick{background:rgba(143,230,195,.22);border-color:rgba(143,230,195,.5)}
  .cell.cough{background:rgba(255,140,107,.22);border-color:rgba(255,140,107,.5)}


  .ice{position:absolute;left:0;right:0;bottom:0;height:26px;border-radius:14px;
       background:linear-gradient(180deg,#DCEFF8,#A8CFE4)}
  .igloo{position:absolute;right:0;bottom:16px}
  .waddle{animation:waddle .7s infinite alternate ease-in-out;transform-origin:50% 90%}
  @keyframes waddle{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
  .skybox{position:relative;height:190px;overflow:hidden;border-radius:18px;
    background:linear-gradient(180deg,#9FE0F5,#D9F2FB)}
  .cloud{position:absolute;width:64px;height:24px;border-radius:999px;background:#fff;opacity:.9}
  .cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud:before{width:30px;height:30px;top:-13px;left:10px}
  .cloud:after{width:22px;height:22px;top:-9px;left:34px}
  .kite{position:absolute;left:50%;bottom:6px;margin-left:-43px;transition:transform .09s linear;
        transform-origin:50% 100%}
  #testBar{height:12px;border-radius:999px;background:rgba(242,247,249,.14);overflow:hidden;margin-top:6px}
  #testFill{height:100%;width:0;background:var(--mint)}
  @media (prefers-reduced-motion:reduce){ .flame{animation:none} }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span id="crumb">Bubble Sky</span>
    <button class="ghostbtn right" id="backBtn" type="button">Menu</button>
  </div>
  <div id="play"></div>
  <div id="bottom">
    <div id="lvlBar"><div id="lvlFill"></div></div>
    <div id="meta"><span id="modeLabel"></span><span id="scoreLabel"></span></div>
  </div>
</div>
<div id="ov"><div class="card" id="card"></div></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const play = $("play");

/* ================= settings + storage ================= */
const DEF = { exhale:4, breaths:10, sets:2, rest:45, inhale:3, reps:4, sens:1,
              band0:1, band1:16, lowFloor:38, lowPeak:78, thr:0.35, gate:0.18 };
let cfg = Object.assign({}, DEF);
const store = {
  get(k,f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
cfg = Object.assign(cfg, store.get("bs_cfg", {}));

function weekKey(){
  const d = new Date(); const day = (d.getDay()+6)%7;      // Monday = 0
  d.setDate(d.getDate()-day);
  return "bs_rec_"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function markToday(activity){
  const rec = store.get(weekKey(), {});
  const day = (new Date().getDay()+6)%7;
  rec[activity] = rec[activity] || [0,0,0,0,0,0,0];
  if(rec[activity][day] === 0) rec[activity][day] = 1;
  store.set(weekKey(), rec);
}

/* ================= microphone ================= */
const mic = {
  on:false, a:null, buf:null, floor:0, peak:1, level:0, fast:0,
  lowFloor:0, lowPeak:1, low:0, blow:0, blowT:0, blowing:false,
  burst:null, onBlast:null,
  async start(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error("This browser won't give the page a microphone.");
    const s = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false }});
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC(); if(ctx.state === "suspended") await ctx.resume();
    const a = ctx.createAnalyser(); a.fftSize = 1024; a.smoothingTimeConstant = 0.35;
    ctx.createMediaStreamSource(s).connect(a);
    this.a = a; this.buf = new Uint8Array(a.frequencyBinCount); this.on = true;
  },
  calibrate(ms=1700){
    return new Promise(res=>{
      let n=0, wide=0, wideMax=0, low=0, lowMax=0;
      const t = setInterval(()=>{
        this.a.getByteFrequencyData(this.buf);
        let w=0,c=0; for(let i=3;i<=90;i++){ w+=this.buf[i]; c++; } w/=c;
        let l=0,d=0; for(let i=cfg.band0;i<=cfg.band1;i++){ l+=this.buf[i]; d++; } l/=d;
        wide+=w; wideMax=Math.max(wideMax,w);
        low+=l;  lowMax=Math.max(lowMax,l); n++;
      },40);
      setTimeout(()=>{
        clearInterval(t);
        this.floor = Math.max((n?wide/n:0)+6, wideMax+2);
        this.peak  = this.floor + 26;
        cfg.lowFloor = Math.max((n?low/n:0)+4, lowMax+2);
        if(cfg.lowPeak < cfg.lowFloor + 8) cfg.lowPeak = cfg.lowFloor + 20;
        store.set("bs_cfg", cfg);
        res();
      }, ms);
    });
  },
  read(dt){
    if(!this.on) return 0;
    this.a.getByteFrequencyData(this.buf);

    // wide band — drives huff and puff detection, which works well as it is
    let sum=0,n=0; for(let i=3;i<=90;i++){ sum+=this.buf[i]; n++; }
    const v = sum/n;
    if(v > this.peak) this.peak = v;
    this.peak = Math.max(this.floor+16, this.peak*0.9994);
    const p = Math.max(0, Math.min(1, (v - this.floor)/Math.max(8, this.peak - this.floor)));
    this.fast  += (p - this.fast)*0.55;
    this.level += (p - this.level)*0.28;
    this.trackBurst(dt);

    // tuned band — set by the microphone tuner, not guessed
    let l=0,c=0; for(let i=cfg.band0;i<=cfg.band1;i++){ l+=this.buf[i]; c++; }
    l /= Math.max(1,c);
    this.lowRaw = l;
    const f = cfg.lowFloor, pk = Math.max(f+8, cfg.lowPeak);
    const q = Math.max(0, Math.min(1, (l - f)/(pk - f)));
    this.low += (q - this.low)*0.30;

    const ON = cfg.thr, OFF = cfg.thr*0.55;
    if(this.low > (this.blowing ? OFF : ON)) this.blowT += dt;
    else this.blowT = 0;
    if(!this.blowing && this.blowT > cfg.gate) this.blowing = true;
    if(this.blowing && this.blowT === 0) this.blowing = false;
    this.blow = this.blowing ? this.low : 0;
    return this.low;
  },
  // a burst = one continuous breath. Reports peak strength and how long it lasted.
  trackBurst(dt){
    const ON = 0.20, OFF = 0.12;
    if(!this.burst && this.fast > ON){
      this.burst = { t:0, peak:this.fast, quiet:0, rise:this.fast };
    }else if(this.burst){
      this.burst.t += dt;
      this.burst.peak = Math.max(this.burst.peak, this.fast);
      if(this.burst.t < 0.25) this.burst.rise = Math.max(this.burst.rise, this.fast);
      if(this.fast < OFF){
        this.burst.quiet += dt;
        if(this.burst.quiet > 0.22){
          const b = this.burst; this.burst = null;
          if(b.t > 0.12 && this.onBlast) this.onBlast({
            peak:b.peak, dur:b.t - b.quiet, sharp:b.rise > 0.32
          });
        }
      }else this.burst.quiet = 0;
    }
  }
};

/* ================= engine ================= */
let view = "home", G = null, raf = null, lastT = 0;
function loop(now){
  raf = requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now-lastT)/1000); lastT = now;
  mic.read(dt);
  const bar = $("lvlFill");
  bar.style.width = (mic.low*100).toFixed(0)+"%";
  bar.style.opacity = mic.blowing ? "1" : ".3";   // faint = heard, but not counted
  if(G && G.update) G.update(dt, mic.blow);
}
mic.onBlast = b => { if(G && G.blast) G.blast(b); };

function setChrome(title, mode, score){
  $("crumb").textContent = title;
  $("modeLabel").textContent = mode || "";
  $("scoreLabel").textContent = score || "";
}
function dots(n, done){
  return '<div class="repdots">'+Array.from({length:n},(_,i)=>
    '<div class="dot'+(i<done?' on':'')+'"></div>').join('')+'</div>';
}
function finishGame(name, line){
  G = null;
  markToday(name);
  show(`<h2>${line}</h2>
        <p>That one's ticked off for today.</p>
        <button class="btn" id="again">Play it again</button>
        <button class="btn ghost" id="menu">Pick another game</button>`,
    { again: ()=>startGame(name), menu: gamesMenu });
}

/* ================= the games ================= */
const GAMES = {

/* ---- SHORT BREATHS ---- */
"Candles":{
  group:"short", desc:"One breath for each candle",
  build(){
    const n = cfg.reps;
    let out = 0;
    play.innerHTML = `<div><div id="hint">Big breath in, then one puff per candle</div>
      <div class="row" id="cds"></div><div id="sub" style="margin-top:20px">${n} to go</div></div>`;
    for(let i=0;i<n;i++){
      const c = document.createElement("div"); c.className="candle";
      c.innerHTML = `<div class="flame"></div><div class="wick"></div>
                     <div class="wax" style="height:${52+(i%3)*14}px"></div>`;
      $("cds").appendChild(c);
    }
    setChrome("Candles","Short breaths","");
    return {
      blast(b){
        if(b.peak < 0.25 || out >= n) return;
        $("cds").children[out].classList.add("out"); out++;
        $("sub").textContent = out >= n ? "All out!" : (n-out)+" to go";
        setChrome("Candles","Short breaths", out+"/"+n);
        if(out >= n) setTimeout(()=>finishGame("Candles","Every candle out"), 700);
      }
    };
  }
},

"Cotton ball":{
  group:"short", desc:"Blow it off your hand — how far?",
  build(){
    let rep = 0, best = 0;
    play.innerHTML = `<div style="width:100%"><div id="hint">Sharp puff — send it flying</div>
      <div class="track"><div class="mover" id="ball" style="left:0">
        <div style="width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4)"></div>
      </div></div>
      <div id="sub">Best so far: 0 cm</div>${dots(cfg.reps,0)}</div>`;
    setChrome("Cotton ball","Short breaths","");
    return {
      blast(b){
        if(b.peak < 0.22 || rep >= cfg.reps) return;
        const cm = Math.round(b.peak * 120);
        best = Math.max(best, cm);
        const ball = $("ball");
        ball.style.left = Math.min(88, b.peak*88)+"%";
        setTimeout(()=>{ ball.style.left = "0"; }, 900);
        rep++;
        $("sub").textContent = "That one: "+cm+" cm · best "+best+" cm";
        play.querySelector(".repdots").outerHTML = dots(cfg.reps, rep);
        setChrome("Cotton ball","Short breaths", rep+"/"+cfg.reps);
        if(rep >= cfg.reps) setTimeout(()=>finishGame("Cotton ball","Furthest: "+best+" cm"), 900);
      }
    };
  }
},

/* ---- LONG BREATHS ---- */
"Blow football":{
  group:"long", title:"Penguin home", desc:"Long breaths to slide him home",
  build(){
    let pos = 0, rep = 0, blowing = false;
    play.innerHTML = `<div style="width:100%"><div id="hint">Big breath in, then one long blow</div>
      <div class="track" style="height:130px;border-bottom:none">
        <div class="ice"></div>
        <svg class="igloo" width="86" height="70" viewBox="0 0 86 70">
          <path d="M4 62 A39 39 0 0 1 82 62 Z" fill="#E8F4FA" stroke="#B9D9E8" stroke-width="3"/>
          <path d="M22 62 A21 21 0 0 1 64 62 Z" fill="#7FB4CE" opacity=".35"/>
          <path d="M31 62 A12 15 0 0 1 55 62 Z" fill="#123A52"/>
          <path d="M4 62 h78" stroke="#B9D9E8" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="mover" id="ball" style="left:0;transition:none">
          <svg width="52" height="58" viewBox="0 0 52 58" class="waddle">
            <ellipse cx="26" cy="34" rx="19" ry="22" fill="#22303B"/>
            <ellipse cx="26" cy="37" rx="13" ry="17" fill="#FFF8EC"/>
            <circle cx="26" cy="15" r="13" fill="#22303B"/>
            <circle cx="21" cy="14" r="3.4" fill="#fff"/><circle cx="31" cy="14" r="3.4" fill="#fff"/>
            <circle cx="21.6" cy="14.6" r="1.7" fill="#12181D"/><circle cx="31.6" cy="14.6" r="1.7" fill="#12181D"/>
            <path d="M26 18 l-5 4 h10 z" fill="#FFA62B"/>
            <ellipse cx="7" cy="34" rx="5" ry="13" fill="#1A252E"/>
            <ellipse cx="45" cy="34" rx="5" ry="13" fill="#1A252E"/>
            <ellipse cx="19" cy="55" rx="7" ry="3.5" fill="#FFA62B"/>
            <ellipse cx="33" cy="55" rx="7" ry="3.5" fill="#FFA62B"/>
          </svg>
        </div>
      </div>
      <div id="sub">Blow him all the way home</div>${dots(cfg.reps+1,0)}</div>`;
    setChrome("Penguin home","Long breaths","");
    return {
      update(dt, lvl){
        const on = lvl > 0;
        if(on){ pos = Math.min(1, pos + (0.05 + lvl*0.15)*dt); blowing = true; }
        else if(blowing){ blowing = false; rep++;
          play.querySelector(".repdots").outerHTML = dots(cfg.reps+1, rep);
        }
        $("ball").style.left = (pos*86)+"%";
        if(pos >= 1){ $("sub").textContent = "Home!";
          const r = rep; G = null; setTimeout(()=>finishGame("Blow football","Home in "+Math.max(1,r+1)+" breaths"), 800); }
      }
    };
  }
},

"Tissue lift":{
  group:"long", title:"Fly the kite", desc:"Keep it flying as long as you can",
  build(){
    let rep = 0, held = 0, best = 0, up = false, grace = 0, lift = 0;
    const target = cfg.exhale;
    play.innerHTML = `<div><div id="hint">Keep it flying for ${target} seconds</div>
      <div class="skybox">
        <div class="cloud" style="left:8%;top:14%"></div>
        <div class="cloud" style="left:62%;top:30%;transform:scale(.75)"></div>
        <div id="tis" class="kite">
          <svg width="86" height="150" viewBox="0 0 86 150">
            <path d="M43 4 L80 46 L43 104 L6 46 Z" fill="#FF8C6B"/>
            <path d="M43 4 L80 46 L43 104 Z" fill="#FFD166"/>
            <path d="M43 4 L43 104 M6 46 L80 46" stroke="rgba(0,0,0,.18)" stroke-width="2"/>
            <path d="M43 104 q12 14 -2 24 q-12 12 2 22" stroke="#F2F7F9" stroke-width="3" fill="none"/>
            <path d="M34 116 h18 M32 136 h18" stroke="#8FE6C3" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <div id="bignum" style="margin-top:10px">0.0</div>
      <div id="sub">of ${target}s · best 0.0</div>${dots(cfg.reps,0)}</div>`;
    setChrome("Fly the kite","Long breaths","");
    function endRep(){
      up = false; best = Math.max(best, held); rep++;
      $("sub").textContent = "of "+target+"s · best "+best.toFixed(1);
      play.querySelector(".repdots").outerHTML = dots(cfg.reps, rep);
      setChrome("Fly the kite","Long breaths", rep+"/"+cfg.reps);
      held = 0; grace = 0; $("bignum").textContent = "0.0";
      if(rep >= cfg.reps){ const b = best; G = null;
        setTimeout(()=>finishGame("Tissue lift","Longest flight: "+b.toFixed(1)+" seconds"), 600); }
    }
    return {
      update(dt, lvl){
        const on = lvl > 0;
        lift += ((on ? lvl : 0) - lift) * 0.2;
        $("tis").style.transform = "translateY(-"+(lift*105).toFixed(0)+"px) rotate("
          + (Math.sin(performance.now()/420)*lift*9).toFixed(1) + "deg)";
        if(on){
          held += dt; up = true; grace = 0;
          $("bignum").textContent = held.toFixed(1);
          $("hint").textContent = held >= target ? "Brilliant — keep her up there"
                                                 : "Keep it flying for "+target+" seconds";
        }else if(up){
          // a tiny gap shouldn't end the breath — it gives her a moment to recover
          grace += dt;
          $("hint").textContent = "Still going?";
          if(grace > 0.8) endRep();
        }
      }
    };
  }
},

"Blow painting":{
  group:"long", desc:"Breath spreads the paint — keep the picture",
  build(){
    let rep = 0, blowing = false, angle = -Math.PI/2;
    play.innerHTML = `<div style="width:100%"><div id="hint">Long steady blows spread the paint</div>
      <canvas id="paintCanvas" width="300" height="300"></canvas>
      <div id="sub">Blow, pause, blow again — it changes direction</div>${dots(cfg.reps,0)}</div>`;
    const cv = $("paintCanvas"), cx = cv.getContext("2d");
    cx.fillStyle = "#F7F3EA"; cx.fillRect(0,0,300,300);
    const cols = ["#E4572E","#2B7FA8","#F2B705","#5B8C5A","#8B5FBF","#D65A9B"];
    let parts = [];
    function seed(){
      const c = cols[Math.floor(Math.random()*cols.length)];
      for(let i=0;i<26;i++) parts.push({
        x:150+(Math.random()*30-15), y:150+(Math.random()*30-15),
        vx:0, vy:0, r:2+Math.random()*5, c
      });
    }
    seed();
    setChrome("Blow painting","Long breaths","");
    return {
      update(dt, lvl){
        const on = lvl > 0;
        if(on){
          blowing = true;
          for(const p of parts){
            p.vx += Math.cos(angle)*lvl*260*dt + (Math.random()-.5)*22*dt;
            p.vy += Math.sin(angle)*lvl*260*dt + (Math.random()-.5)*22*dt;
          }
        }else if(blowing){
          blowing = false; rep++; angle += 1.4 + Math.random()*1.2;
          play.querySelector(".repdots").outerHTML = dots(cfg.reps, rep);
          setChrome("Blow painting","Long breaths", rep+"/"+cfg.reps);
          if(rep >= cfg.reps){ G = null;
            setTimeout(()=>finishGame("Paint Blowing","Picture finished"), 900); return; }
          seed();
        }
        for(const p of parts){
          p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.94; p.vy *= 0.94;
          cx.fillStyle = p.c; cx.globalAlpha = 0.5;
          cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill();
        }
        cx.globalAlpha = 1;
        parts = parts.filter(p => p.x > -20 && p.x < 320 && p.y > -20 && p.y < 320);
      }
    };
  }
},

"Windmill":{
  group:"long", desc:"Keep it spinning — count the turns",
  build(){
    let spin = 0, ang = 0, turns = 0, rep = 0, blowing = false;
    play.innerHTML = `<div><div id="hint">A long breath keeps it turning</div>
      <svg width="180" height="180" viewBox="0 0 170 170">
        <g id="pw" transform-origin="85 85">
          <path d="M85 85 L85 18 Q118 22 112 58 Z" fill="#8FE6C3"/>
          <path d="M85 85 L152 85 Q148 118 112 112 Z" fill="#FFD166"/>
          <path d="M85 85 L85 152 Q52 148 58 112 Z" fill="#FF8C6B"/>
          <path d="M85 85 L18 85 Q22 52 58 58 Z" fill="#B79CFF"/>
        </g><circle cx="85" cy="85" r="8" fill="#F2F7F9"/></svg>
      <div id="bignum">0</div><div id="sub">turns</div>${dots(cfg.reps,0)}</div>`;
    setChrome("Windmill","Long breaths","");
    return {
      update(dt, lvl){
        spin += lvl*1.7*dt; spin -= spin*0.85*dt; spin = Math.max(0, spin);

        $("bignum").textContent = turns;

        if(on) blowing = true;

          blowing = false; rep++;
          play.querySelector(".repdots").outerHTML = dots(cfg.reps, rep);
          if(rep >= cfg.reps){ const t = turns; G = null;
            setTimeout(()=>finishGame("Windmills", t+" turns altogether"), 600); }
        }
      }
    };
  }
},

/* ================= bubble PEP session ================= */
function bubbleSession(){
  let S = { set:1, breath:1, phase:"inhale", t:0, blown:0, quiet:0, bubbles:0 };
  play.innerHTML = `<div><div id="hint">Getting ready</div>
    <div id="bignum">—</div><div id="sub"></div>
    <div id="cue" style="margin-top:16px;font-size:18px;font-weight:800;min-height:24px"></div></div>`;
  setChrome("Bubble PEP","Bubble session","");
  G = {
    update(dt, lvl){
      S.t += dt;
      setChrome("Bubble PEP","Set "+S.set+"/"+cfg.sets, "Breath "+Math.min(S.breath,cfg.breaths)+"/"+cfg.breaths);
      if(S.phase === "inhale"){
        const left = Math.max(0, cfg.inhale - S.t);
        $("hint").textContent = "Breathe in";
        $("bignum").textContent = Math.ceil(left); $("sub").textContent = "";
        $("cue").textContent = "slow and easy";
        if(left <= 0){ S.phase="exhale"; S.t=0; S.blown=0; S.quiet=0; }
        return;
      }
      if(S.phase === "exhale"){
        $("hint").textContent = "Blow bubbles";
        const hearing = lvl > 0;
        if(hearing){ S.blown += dt; S.quiet = 0; } else if(S.blown > 0) S.quiet += dt;
        $("bignum").textContent = S.blown.toFixed(1);
        $("sub").textContent = "of "+cfg.exhale+"s";
        $("cue").textContent = hearing ? "keep it going" : (S.blown>0 ? "" : "start when ready");
        const ended = (S.blown > 0.4 && S.quiet > 0.7) || S.blown >= cfg.exhale*1.8;
        if(ended || S.t > cfg.exhale*3+8){
          S.bubbles++; S.breath++; S.t = 0;
          if(S.breath > cfg.breaths){
            if(S.set >= cfg.sets){ G = null; markToday("Bubble"); return finishGame("Bubble", S.bubbles+" breaths done"); }
            S.phase = "rest";
          } else S.phase = "inhale";
        }
        return;
      }
      if(S.phase === "rest"){
        const left = Math.max(0, cfg.rest - S.t);
        $("hint").textContent = "Rest and clear";
        $("bignum").textContent = Math.ceil(left); $("sub").textContent = "seconds";
        $("cue").textContent = "huff and cough if you need to";
        if(left <= 0){ S.set++; S.breath=1; S.phase="inhale"; S.t=0; }
      }
    }
  };
  hide();
}


/* ================= microphone tuner ================= */
function binHz(i){ return Math.round(i * 44100 / 1024); }

function tuner(){
  G = null; play.innerHTML = "";
  let noise = null, breath = null, spinT = null;

  function render(msg){
    show(`<h2>Tune the microphone</h2>
      <p>${msg || "Two quick recordings and it will work out which sounds are her breath and which are the room."}</p>
      <canvas id="spec" width="320" height="120" style="width:100%;border-radius:12px;background:rgba(0,0,0,.25)"></canvas>
      <div id="live" style="font-size:13px;color:var(--dim);margin:8px 0 4px">—</div>
      <div id="testBar"><div id="testFill"></div></div>
      <button class="btn" id="recNoise">1 · Record the room <span style="opacity:.6">${noise?"✓":""}</span></button>
      <button class="btn" id="recBreath">2 · Record her breathing <span style="opacity:.6">${breath?"✓":""}</span></button>
      <button class="btn ghost" id="auto">3 · Work out the best settings</button>
      <div class="rule"></div>
      <div class="field"><label>Listening from<small id="l0">${binHz(cfg.band0)} Hz</small></label>
        <input id="s0" type="range" min="1" max="60" value="${cfg.band0}" style="width:130px"></div>
      <div class="field"><label>Listening to<small id="l1">${binHz(cfg.band1)} Hz</small></label>
        <input id="s1" type="range" min="4" max="120" value="${cfg.band1}" style="width:130px"></div>
      <div class="field"><label>How loud it must be<small id="lt">${cfg.thr.toFixed(2)}</small></label>
        <input id="st" type="range" min="0.1" max="0.9" step="0.02" value="${cfg.thr}" style="width:130px"></div>
      <div class="rule"></div>
      <button class="btn" id="save">Save these settings</button>
      <button class="btn ghost" id="profiles">Saved setups</button>
      <button class="btn ghost" id="back">Back</button>`,
      {
        recNoise: ()=>grab("noise"),
        recBreath: ()=>grab("breath"),
        auto: autoTune,
        save: ()=>{ store.set("bs_cfg", cfg); stopSpec(); home(); },
        profiles: profiles,
        back: ()=>{ stopSpec(); home(); }
      });

    ["s0","s1","st"].forEach(id=>{
      const el = $(id); if(!el) return;
      el.addEventListener("input", ()=>{
        cfg.band0 = Math.min(+$("s0").value, +$("s1").value - 3);
        cfg.band1 = Math.max(+$("s1").value, cfg.band0 + 3);
        cfg.thr   = parseFloat($("st").value);
        $("l0").textContent = binHz(cfg.band0)+" Hz";
        $("l1").textContent = binHz(cfg.band1)+" Hz";
        $("lt").textContent = cfg.thr.toFixed(2);
      });
    });
    startSpec();
  }

  function startSpec(){
    stopSpec();
    const cv = $("spec"); if(!cv) return;
    const cx = cv.getContext("2d");
    spinT = setInterval(()=>{
      if(!cv.isConnected) return stopSpec();
      mic.read(0.05);
      cx.clearRect(0,0,320,120);
      for(let i=0;i<128;i++){
        const v = mic.buf[i]/255;
        const inBand = i >= cfg.band0 && i <= cfg.band1;
        cx.fillStyle = inBand ? "#8FE6C3" : "rgba(242,247,249,.22)";
        cx.fillRect(i*2.5, 120 - v*118, 2, v*118);
      }
      const f = $("testFill"); if(f) f.style.width = (mic.low*100).toFixed(0)+"%";
      const lv = $("live");
      if(lv) lv.textContent = mic.blowing
        ? "Counting this as a breath"
        : "Hearing something, not counting it";
    }, 60);
  }
  function stopSpec(){ if(spinT){ clearInterval(spinT); spinT = null; } }

  function grab(which){
    const secs = which === "noise" ? 3 : 5;
    const label = which === "noise"
      ? "Stay quiet — recording the room"
      : "Get her to blow, in bursts, until this finishes";
    let left = secs;
    const prof = new Float32Array(128);
    let frames = 0;
    show(`<h2>${label}</h2><p id="cd" style="font-size:40px;color:var(--paper)">${secs}</p>`, {});
    const t = setInterval(()=>{
      mic.a.getByteFrequencyData(mic.buf);
      for(let i=0;i<128;i++){
        // breath: keep the loudest moments. room: keep the average.
        if(which === "breath") prof[i] = Math.max(prof[i], mic.buf[i]);
        else prof[i] += mic.buf[i];
      }
      frames++;
    }, 40);
    const cd = setInterval(()=>{ left--; const e = $("cd"); if(e) e.textContent = left; }, 1000);
    setTimeout(()=>{
      clearInterval(t); clearInterval(cd);
      if(which === "room" || which === "noise"){
        for(let i=0;i<128;i++) prof[i] /= Math.max(1,frames);
        noise = prof;
      } else breath = prof;
      render(which === "breath"
        ? "Breathing recorded. Now tap 3 and it will pick the band."
        : "Room recorded. Now record her breathing.");
    }, secs*1000);
  }

  function autoTune(){
    if(!noise || !breath) return render("Record the room and her breathing first — both are needed.");
    // how much louder is her breath than the room, bin by bin
    const gain = [];
    for(let i=1;i<120;i++) gain[i] = breath[i] - noise[i];
    // best contiguous stretch of bins, at least 6 wide
    let best = {score:-1e9, a:1, b:16};
    for(let a=1;a<110;a++){
      let sum = 0;
      for(let b=a;b<Math.min(120,a+70);b++){
        sum += gain[b];
        const w = b-a+1;
        if(w < 6) continue;
        const score = sum / Math.sqrt(w);      // favour strong, reasonably tight bands
        if(score > best.score) best = {score, a, b};
      }
    }
    cfg.band0 = best.a; cfg.band1 = best.b;
    let nf = 0, bf = 0, n = 0;
    for(let i=cfg.band0;i<=cfg.band1;i++){ nf += noise[i]; bf += breath[i]; n++; }
    nf /= n; bf /= n;
    cfg.lowFloor = nf + 3;
    cfg.lowPeak  = Math.max(nf + 12, bf);
    cfg.thr = 0.30;
    store.set("bs_cfg", cfg);
    const sep = (bf - nf).toFixed(0);
    render(sep < 8
      ? `Set to ${binHz(cfg.band0)}–${binHz(cfg.band1)} Hz, but her breath is only ${sep} louder than the room there. Move the phone closer or try again somewhere quieter.`
      : `Set to ${binHz(cfg.band0)}–${binHz(cfg.band1)} Hz, where her breath is ${sep} louder than the room. Test it on the bar above, then save.`);
  }

  render();
}

function show(html, handlers){
  $("card").innerHTML = html; $("ov").classList.remove("hide"); G = null;
  for(const k in handlers){ const el = $(k); if(el) el.addEventListener("click", handlers[k]); }
}
function hide(){ $("ov").classList.add("hide"); }

function startGame(name){
  const def = GAMES[name]; if(!def) return gamesMenu();
  hide(); G = def.build();
}

function needMic(then){
  show(`<h2>Listening to the room</h2><p>Keep quiet for a second while it works out the background noise.</p>`, {});
  (async ()=>{
    try{ if(!mic.on) await mic.start(); await mic.calibrate(); then(); }
    catch(err){
      const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
      show(`<h2>No microphone</h2>
        <p>${denied ? "The microphone was blocked. Check the padlock in the address bar, or Android Settings → Apps → Chrome → Permissions → Microphone."
                    : (err && err.message) || "Couldn't reach the microphone."}</p>
        <button class="btn" id="back">Back</button>`, { back: home });
    }
  })();
}

    html += `<tr><td>${a}</td>`;

    }
    html += `</tr>`;
  });
  html += `</table><div class="rule"></div><button class="btn ghost" id="back">Back</button>`;

      <input id="f_rest" type="number" min="5" max="300" value="${cfg.rest}"></div>
    <div class="field"><label>Breathe-in cue<small>seconds</small></label>
      <input id="f_inhale" type="number" min="1" max="15" value="${cfg.inhale}"></div>
    <div class="rule"></div>
    <button class="btn" id="save">Save</button>
    <button class="btn ghost" id="reset">Back to defaults</button>`,
  {
    save: ()=>{
      const num=(id,lo,hi,fb)=>{ const v=parseFloat($(id).value);
        return isNaN(v)?fb:Math.max(lo,Math.min(hi,v)); };
      cfg.reps    = Math.round(num("f_reps",1,12,DEF.reps));
      cfg.sens    = num("f_sens",0.5,2,DEF.sens);
      cfg.exhale  = num("f_exhale",1,30,DEF.exhale);
      cfg.breaths = Math.round(num("f_breaths",1,40,DEF.breaths));
      cfg.sets    = Math.round(num("f_sets",1,10,DEF.sets));
      cfg.rest    = Math.round(num("f_rest",5,300,DEF.rest));
      cfg.inhale  = num("f_inhale",1,15,DEF.inhale);
      store.set("bs_cfg", cfg); home();
    },
    reset: ()=>{ cfg = Object.assign({}, DEF); store.set("bs_cfg", cfg); settings(); }
  });
}

$("backBtn").addEventListener("click", ()=>{ G = null; gamesMenu(); });
home();
lastT = performance.now();
raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
